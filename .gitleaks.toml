# gitleaks config: the default rules, plus a narrow allowlist of known non-secrets.
# Each entry is one EXACT value, anchored ^…$ and matched against the whole secret, so a real secret
# that merely contains one of these strings is still reported (Oracle review of #207). Every entry is
# a sha256 pin of a vendored file (rust/tapstone-web/www/xr/tools/fetch_kws.mjs), which the
# generic-api-key rule reads as a key. Add a pin only after recomputing it from the file (sha256sum)
# and naming the file.
[extend]
useDefault = true

[[allowlists]]
description = "sha256 pins of vendored voice-spotter files, not secrets"
regexTarget = "secret"
regexes = [
  '''^49e3c2646595fd907228b3c6787069658f67b17377c60aeb8619c4551b2316fb$''',  # public/kws/tokens.txt
  '''^03b44e372795fd907e84eecd29419e1d052dc6704ac06935c9bf9fe19b3e3434$''',  # public/kws/kws-api.js (sherpa-onnx 1.13.8)
]
