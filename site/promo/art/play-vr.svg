<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
<title id="t">Play in VR: a headset</title>
<!-- Tapstone promo icon (hand-authored SVG). A self-contained badge: dark disc, gold rim, so it
     works on dark and light pages. A generic headset, not any product's likeness. -->
<defs><linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#35c8e0"/></linearGradient></defs>
<circle cx="128" cy="128" r="122" fill="#1a1626" stroke="#c9a24a" stroke-width="8"/>
<circle cx="128" cy="128" r="80" fill="#35c8e0" fill-opacity=".1"/>
<g stroke="#0c0a10" stroke-width="5" stroke-linejoin="round">
  <!-- strap -->
  <path d="M40 120q-6-50 88-56q94 6 88 56" fill="none" stroke="#5a5470" stroke-width="16"/>
  <!-- visor -->
  <rect x="44" y="92" width="168" height="84" rx="30" fill="#eee7d6"/>
  <rect x="56" y="104" width="144" height="60" rx="22" fill="#2a2438"/>
  <path d="M110 176q18-22 36 0" fill="#eee7d6"/>
</g>
