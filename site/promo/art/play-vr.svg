</g>
<path d="M66 112q20-6 36-4" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-opacity=".5"/>
<g fill="#ffd27a"><path d="M200 58l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M52 194l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g>
