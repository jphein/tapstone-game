<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="t d">
<title id="t">The red door opens onto the Dueling Grounds</title>
<desc id="d">A red door beneath a gateway swings open. Through it, in a pocket dimension under a dusk sky, the Dueling Grounds board floats: three lanes of six cells, with your units standing as figures and the opponent's as stone.</desc>
<!-- Tapstone promo art (hand-authored SVG). No page background: the gateway and its glow sit on
     transparency, so the image works on dark and light pages. -->
<defs>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffb35a" stop-opacity=".7"/><stop offset=".6" stop-color="#ff5a3a" stop-opacity=".18"/><stop offset="1" stop-color="#ff5a3a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b1640"/><stop offset=".45" stop-color="#5a2a6a"/><stop offset=".8" stop-color="#e0643a"/><stop offset="1" stop-color="#ffc26a"/>
  </linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7a101a"/><stop offset=".6" stop-color="#d02a2a"/><stop offset="1" stop-color="#9a1822"/>
  </linearGradient>
  <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a3f52"/><stop offset="1" stop-color="#1c1824" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe2a0" stop-opacity=".0"/><stop offset="1" stop-color="#ffe2a0" stop-opacity=".45"/>
  </linearGradient>
  <clipPath id="open"><rect x="250" y="170" width="400" height="630"/></clipPath>
  <!-- 16x16 pixel figure (Ember knight), drawn on a 1-unit grid -->
  <symbol id="knight" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <path d="M6 1h4v1h1v3H5V2h1z" fill="#d9d4c8"/><path d="M6 3h4v1H6z" fill="#1a1020"/>
    <path d="M4 6h8v5H4z" fill="#ff8a3d"/><path d="M5 7h6v1H5z" fill="#ffd27a"/>
    <path d="M3 6h1v4H3zM12 6h1v4h-1z" fill="#b5501f"/>
    <path d="M13 1h1v8h-1z" fill="#eef2ff"/><path d="M12 8h3v1h-3z" fill="#c9a24a"/>
    <path d="M5 11h2v4H5zM9 11h2v4H9z" fill="#5a2a18"/>
  </symbol>
  <!-- opponent unit as a stone plinth with a Tide rune -->
  <symbol id="stone" viewBox="0 0 16 16">
    <path d="M3 14l1-9 4-3 4 3 1 9z" fill="#8a8a94"/><path d="M8 2l4 3 1 9H8z" fill="#5e5e6a"/>
    <path d="M2 14h12v2H2z" fill="#4a4a54"/>
    <path d="M8 6v5M6 8.5h4" stroke="#35c8e0" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>
</defs>
<circle cx="450" cy="470" r="440" fill="url(#glow)"/>
<!-- the pocket dimension, seen through the doorway -->
<g clip-path="url(#open)">
  <rect x="250" y="170" width="400" height="630" fill="url(#sky)"/>
  <g fill="#fff6d8">
    <circle cx="290" cy="200" r="1.6"/><circle cx="340" cy="240" r="1.2"/><circle cx="420" cy="195" r="1.8"/><circle cx="520" cy="220" r="1.3"/>
    <circle cx="600" cy="190" r="1.7"/><circle cx="580" cy="270" r="1.1"/><circle cx="310" cy="300" r="1.2"/><circle cx="470" cy="260" r="1"/>
  </g>
  <!-- distant floating islands -->
  <path d="M280 420h60l-10 14-18 10-20-8z" fill="#3a2a48"/><path d="M560 380h70l-12 16-24 8-22-10z" fill="#3a2a48"/>
  <path d="M290 420q20-14 44 0" fill="#6a4a5a"/>
  <!-- the board's floating stone slab -->
  <path d="M240 780l-10 30 100 60h240l100-60-10-30z" fill="url(#rock)"/>
  <polygon points="244,786 656,786 530,498 370,498" fill="#2a2432"/>
  <polygon points="253,778 647,778 526,503 374,503" fill="#3b3346"/>
  <!-- my half: warm rims -->
  <g fill="#4a3a36" stroke="#ff8a3d" stroke-width="2" stroke-opacity=".75">
    <polygon points="275,760 392,760 403,677 309,677"/><polygon points="392,760 508,760 497,677 403,677"/><polygon points="508,760 625,760 591,677 497,677"/>
    <polygon points="309,677 403,677 411,621 332,621"/><polygon points="403,677 497,677 489,621 411,621"/><polygon points="497,677 591,677 568,621 489,621"/>
    <polygon points="332,621 411,621 416,580 348,580"/><polygon points="411,621 489,621 484,580 416,580"/><polygon points="489,621 568,621 552,580 484,580"/>
  </g>
  <!-- their half: cool rims -->
  <g fill="#2e3646" stroke="#35c8e0" stroke-width="1.5" stroke-opacity=".7">
    <polygon points="348,580 416,580 420,549 361,549"/><polygon points="416,580 484,580 480,549 420,549"/><polygon points="484,580 552,580 539,549 480,549"/>
    <polygon points="361,549 420,549 423,525 370,525"/><polygon points="420,549 480,549 477,525 423,525"/><polygon points="480,549 539,549 530,525 477,525"/>
    <polygon points="370,525 423,525 426,506 378,506"/><polygon points="423,525 477,525 474,506 426,506"/><polygon points="477,525 530,525 522,506 474,506"/>
  </g>
  <path d="M348 580h204" stroke="#ffd27a" stroke-width="2.5"/>
  <!-- units: mine as figures, theirs as stone -->
  <ellipse cx="346" cy="736" rx="34" ry="8" fill="#000" fill-opacity=".35"/>
  <use href="#knight" x="302" y="656" width="88" height="88"/>
  <ellipse cx="450" cy="662" rx="26" ry="7" fill="#000" fill-opacity=".35"/>
  <use href="#knight" x="416" y="596" width="68" height="68"/>
  <use href="#stone" x="492" y="526" width="42" height="42"/>
  <use href="#stone" x="383" y="488" width="34" height="34"/>
  <use href="#stone" x="488" y="490" width="32" height="32"/>
  <!-- light pouring back through the door -->
  <path d="M250 800l-60 100h520l-60-100z" fill="url(#beam)"/>
</g>
<!-- door leaves, swung open toward us -->
<path d="M250 170l-96-40v716l96-46z" fill="url(#red)"/>
<path d="M650 170l96-40v716l-96-46z" fill="url(#red)"/>
<g fill="none" stroke="#4e0a12" stroke-width="5">
  <path d="M176 164l54 20v230l-54-8zM176 440l54 4v250l-54 30zM724 164l-54 20v230l54-8zM724 440l-54 4v250l54 30z"/>
</g>
<g fill="#c9a24a"><circle cx="232" cy="460" r="8"/><circle cx="668" cy="460" r="8"/></g>
<path d="M250 170v630M650 170v630" stroke="#fff0c0" stroke-width="4" stroke-opacity=".85"/>
<!-- torii-style gateway -->
<g fill="#b3202a">
  <rect x="96" y="104" width="34" height="740"/><rect x="770" y="104" width="34" height="740"/>
  <path d="M30 50q420 40 840 0l-10 40q-410 30-820 0z"/>
  <rect x="70" y="108" width="760" height="26"/>
  <rect x="434" y="80" width="32" height="30"/>
</g>
<path d="M30 50q420 40 840 0l-3 12q-417 36-834 0z" fill="#241016"/>
<g fill="#241016"><rect x="92" y="836" width="42" height="18"/><rect x="766" y="836" width="42" height="18"/></g>
<!-- shimenawa rope and paper streamers -->
<path d="M130 168q320 70 640 0" fill="none" stroke="#e8d3a0" stroke-width="14" stroke-linecap="round"/>
<path d="M130 168q320 70 640 0" fill="none" stroke="#a88a52" stroke-width="4" stroke-dasharray="8 10"/>
<g fill="#fffaf0" stroke="#c9b48a" stroke-width="1.5"><path d="M330 200l10 36h-12l10 26"/><path d="M450 212l10 36h-12l10 26"/><path d="M570 200l10 36h-12l10 26"/></g>
<!-- stepped threshold -->
<g fill="#6a4a3a" stroke="#3a2418" stroke-width="3"><rect x="220" y="800" width="460" height="22"/><rect x="180" y="822" width="540" height="22"/></g>
<!-- motes drifting out -->
<g fill="#ffd27a"><circle cx="300" cy="120" r="4"/><circle cx="610" cy="100" r="3"/><circle cx="700" cy="300" r="3"/><circle cx="190" cy="330" r="3.5"/><circle cx="820" cy="600" r="2.5"/><circle cx="60" cy="560" r="3"/></g>
</svg>
