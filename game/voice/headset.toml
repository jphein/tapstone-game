# ---- 0033's list: the commander, which the headset does not say yet -----------------------------
[[line]]
id = "commander-returns"
text = "Your commander returns next round."
[[line]]
id = "commander-back"
text = "Your commander is back on the field."

# ---- expanded lines ----------------------------------------------------------------------------
# play.js voiceFor(): `Draw ${me.owed_draws}: …`. The opening hand owes 5 (0036), the most at once.
[[template]]
id = "draw-{n}"
text = "Draw {n}: touch the top card of your deck to the stone."
n = [1, 2, 3, 4, 5]

# play.js lift(): `${card.name}: touch a pad.` for every card a hand can hold (set 1, not castles).
[[template]]
id = "card-{slug}"
text = "{name}: touch a pad."
cards = "game/cards/set1"

# Level-up (0033's list). The levels come from the shrine's generated level_up clips, which
# progression's table produced, so the headset never names a level the game lacks.
[[template]]
id = "level-{n}"
text = "Level {n}."
levels_from = "game/voice/clips.tsv"

