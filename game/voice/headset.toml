# The headset's fixed voice lines (0033 "Speaking": every predictable sentence is pre-rendered).
# `python3 tools/voice_lines.py` renders them with Azure Speech into
# rust/tapstone-web/www/xr/public/voice/ and writes manifest.json beside them; only lines whose
# text changed are sent again. The altar plays a clip when its text matches a line here EXACTLY,
# and otherwise draws the text alone (src/logic/voice.js), so a line missing here is silent, not
# broken.
#
# This is the headset's clip set. The shrine's clips are a different set with different wording
# (game/voice/clips.tsv, rendered with Piper per 0033) and nothing here changes them.
#
# The text must be the headset's own string, character for character: test/voice.test.js reads
# every literal the headset says and fails if one is missing from the rendered manifest.

voice = "en-US-Ava:DragonHDLatestNeural"
format = "webm-24khz-16bit-mono-opus"
ext = "webm"

