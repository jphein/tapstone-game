<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#0e1116"/><text x="40.0" y="60.0" font-size="30" fill="#f2efe6" text-anchor="start" font-weight="700" font-family="Inter, system-ui, sans-serif" >Cross-play: one authoritative chain, many views (0037)</text><text x="40.0" y="96.0" font-size="18" fill="#8a93a3" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >Every view subscribes to the same /events SSE stream. Only taps change state; the headset is a view plus an input surface.</text><rect x="60" y="150" width="400" height="330" rx="14" fill="#161b22" stroke="#e0a526" stroke-width="2.5"/><text x="80.0" y="186.0" font-size="23" fill="#e0a526" text-anchor="start" font-weight="700" font-family="Inter, system-ui, sans-serif" >Hardware chain</text><text x="80.0" y="212.0" font-size="16" fill="#8a93a3" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >authoritative — unchanged by VR</text><text x="80.0" y="246.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >shrine A ─┐</text><text x="80.0" y="272.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >shrine B ─┴─ ESP-NOW ─ gateway</text><text x="80.0" y="298.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >        ═ serial ═ tapstone-arena</text><text x="80.0" y="324.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >arbiter · ledger · hash chain</text><text x="80.0" y="350.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" ></text><text x="80.0" y="376.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >taps in  →  commits out</text><text x="80.0" y="402.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >C mseq=n  hash=h_n</text><rect x="560" y="290" width="200" height="60" rx="30" fill="#e0a526"/><text x="660.0" y="328.0" font-size="20" fill="#1a1406" text-anchor="middle" font-weight="700" font-family="Inter, system-ui, sans-serif" >/events (SSE)</text><line x1="460" y1="320" x2="560" y2="320" stroke="#e0a526" stroke-width="4"/><path d="M760,320 C820,320 820,230 880,230" stroke="#e0a526" stroke-width="3" fill="none"/><rect x="880" y="170" width="660" height="160" rx="14" fill="#161b22" stroke="#8a93a3" stroke-width="2.5"/><text x="900.0" y="206.0" font-size="23" fill="#8a93a3" text-anchor="start" font-weight="700" font-family="Inter, system-ui, sans-serif" >Browser board  /</text><text x="900.0" y="232.0" font-size="16" fill="#8a93a3" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >the table's shared screen (playtest one)</text><text x="900.0" y="266.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >both seats as objects, flat 2D canvas</text><text x="900.0" y="292.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >input: none (shrines only)</text><path d="M760,320 C820,320 820,430 880,430" stroke="#e0a526" stroke-width="3" fill="none"/><rect x="880" y="370" width="660" height="180" rx="14" fill="#161b22" stroke="#e8663a" stroke-width="2.5"/><text x="900.0" y="406.0" font-size="23" fill="#e8663a" text-anchor="start" font-weight="700" font-family="Inter, system-ui, sans-serif" >Headset player  /xr?seat=0</text><text x="900.0" y="432.0" font-size="16" fill="#8a93a3" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >MR at the table, or VR anywhere</text><text x="900.0" y="466.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >mine = figures, theirs = plinths</text><text x="900.0" y="492.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >input: paper taps; optional point-to-</text><text x="900.0" y="518.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >answer a prompt (via the shrine, see §2.3)</text><path d="M760,320 C820,320 820,650 880,650" stroke="#e0a526" stroke-width="3" fill="none"/><rect x="880" y="590" width="660" height="160" rx="14" fill="#161b22" stroke="#3aa0e8" stroke-width="2.5"/><text x="900.0" y="626.0" font-size="23" fill="#3aa0e8" text-anchor="start" font-weight="700" font-family="Inter, system-ui, sans-serif" >Browser player  /?seat=1</text><text x="900.0" y="652.0" font-size="16" fill="#8a93a3" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >no headset — the same match, flat</text><text x="900.0" y="686.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >mine = tiles, theirs = chips (0027)</text><text x="900.0" y="712.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >sees the VR player's taps as normal taps</text><path d="M760,320 C820,320 820,850 880,850" stroke="#e0a526" stroke-width="3" fill="none"/><rect x="880" y="790" width="660" height="160" rx="14" fill="#161b22" stroke="#b07cff" stroke-width="2.5"/><text x="900.0" y="826.0" font-size="23" fill="#b07cff" text-anchor="start" font-weight="700" font-family="Inter, system-ui, sans-serif" >Spectator headset  /xr?view=spectator</text><text x="900.0" y="852.0" font-size="16" fill="#8a93a3" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >free orbit, lift the board to eye level</text><text x="900.0" y="886.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >both seats as figures, no private state</text><text x="900.0" y="912.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >hands as counts only — never card names</text><rect x="60" y="540" width="700" height="400" rx="14" fill="#161b22" stroke="#ff5fd2" stroke-width="2.5"/><text x="80.0" y="576.0" font-size="23" fill="#ff5fd2" text-anchor="start" font-weight="700" font-family="Inter, system-ui, sans-serif" >The invariants</text><text x="80.0" y="602.0" font-size="16" fill="#8a93a3" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >what makes it cross-play and not 'VR edition'</text><text x="80.0" y="636.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >1. No view holds state. Kill every headset: the match continues.</text><text x="80.0" y="662.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >2. Every view reads the same view model; no rules in any client.</text><text x="80.0" y="688.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >3. A headset input is a proposal to the arbiter, like a tap —</text><text x="80.0" y="714.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >    refused by the same engine, with the same refusal codes.</text><text x="80.0" y="740.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >4. Private information never enters the view model (hand = count).</text><text x="80.0" y="766.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >    So a spectator headset is safe by construction.</text><text x="80.0" y="792.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >5. A VR player gets no information edge: the browser seat view</text><text x="80.0" y="818.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >    and the headset seat view carry identical facts.</text><text x="80.0" y="844.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >6. Effects are view-diffed (0027 amendment): beams, cracks and</text><text x="80.0" y="870.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >    arrivals are computed from consecutive models, never sent.</text></svg>