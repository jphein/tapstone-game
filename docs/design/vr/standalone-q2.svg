eight="400" font-family="Inter, system-ui, sans-serif" >Real objects can't occlude it: the real</text><text x="1202.0" y="242.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >mug on the right lane is painted over.</text><line x1="1234" y1="765" x2="1180" y2="415.0" stroke="#ff5fd2" stroke-width="2"/><circle cx="1234" cy="765" r="6" fill="#ff5fd2"/><rect x="1180" y="360" width="390" height="110" rx="8" fill="#140a14" fill-opacity="0.88" stroke="#ff5fd2"/><circle cx="1180" cy="360" r="15" fill="#ff5fd2"/><text x="1180.0" y="366.0" font-size="17" fill="#140a14" text-anchor="middle" font-weight="700" font-family="Inter, system-ui, sans-serif" >2</text><text x="1202.0" y="390.0" font-size="18" fill="#ffd6f5" text-anchor="start" font-weight="650" font-family="Inter, system-ui, sans-serif" >Ghost hand over the board</text><text x="1202.0" y="414.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >No depth → draw the tracked hand as a</text><text x="1202.0" y="438.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >lit outline ON TOP, so the finger never</text><text x="1202.0" y="462.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >vanishes behind the card it's holding.</text><line x1="800" y1="601" x2="1180" y2="635.0" stroke="#ff5fd2" stroke-width="2"/><circle cx="800" cy="601" r="6" fill="#ff5fd2"/><rect x="1180" y="580" width="390" height="110" rx="8" fill="#140a14" fill-opacity="0.88" stroke="#ff5fd2"/><circle cx="1180" cy="580" r="15" fill="#ff5fd2"/><text x="1180.0" y="586.0" font-size="17" fill="#140a14" text-anchor="middle" font-weight="700" font-family="Inter, system-ui, sans-serif" >3</text><text x="1202.0" y="610.0" font-size="18" fill="#ffd6f5" text-anchor="start" font-weight="650" font-family="Inter, system-ui, sans-serif" >Placement: palm-press, then drag</text><text x="1202.0" y="634.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >Press your palm flat on the table (sets</text><text x="1202.0" y="658.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >the height), pinch-drag the board.</text><text x="1202.0" y="682.0" font-size="17" fill="#f2efe6" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >No table detection needed.</text><text x="40.0" y="60.0" font-size="30" fill="#f2efe6" text-anchor="start" font-weight="700" font-family="Inter, system-ui, sans-serif" >Judged standalone mode, Quest 2 (degraded)</text><text x="40.0" y="98.0" font-size="18" fill="#8a93a3" text-anchor="start" font-weight="400" font-family="Inter, system-ui, sans-serif" >virtual shrine + lane pads + deck on your real table · bot opponent · no controller, no hardware, no network</text></svg>